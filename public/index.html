<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080c;--card:#0f121a;--ln:#1f2430;--tx:#f4f6fa;--mut:#8b93a7;--ac:#1a8cff;--red:#ff453a;--ok:#30d158;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hh,80px) + 30px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;background:radial-gradient(800px 500px at 90% 75%,#0b2a55 0,transparent 60%),radial-gradient(700px 420px at 5% 5%,#081f3d 0,transparent 60%),var(--bg) fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,.disp{font-family:"Space Grotesk",Inter,sans-serif}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 5vw;background:rgba(7,8,12,.94);border-bottom:1px solid var(--ln)}
header img{height:54px;display:block}
nav{display:flex;gap:22px;font-weight:600;font-size:14px}nav a:hover{color:var(--ac)}
.hr{display:flex;gap:10px;align-items:center}
.pill{font-size:11px;padding:6px 12px;border:1px solid #1d3a63;border-radius:99px;color:#6fb1ff;background:#0b1830;white-space:nowrap}
.btn{display:inline-block;text-align:center;border:1px solid var(--ac);cursor:pointer;background:var(--ac);color:#fff;font:700 12px "Space Grotesk",sans-serif;letter-spacing:.5px;text-transform:uppercase;padding:12px 18px;border-radius:10px}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:transparent;color:var(--tx);border-color:#3a4255}
.btn.ghost:hover{border-color:var(--ac);color:#6fb1ff}
.btn[disabled]{background:#1a1d26;border-color:#1a1d26;color:#6b7280;cursor:not-allowed;filter:none}
.btn.full{width:100%}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hero{text-align:center;padding:40px 5vw 56px}
.hero img{width:min(380px,80vw);height:auto}
.hero h1{font-size:clamp(28px,6vw,56px);line-height:1.06;margin:6px auto 14px;max-width:900px;text-transform:uppercase;letter-spacing:-1px;text-wrap:balance}
.hero p{max-width:520px;margin:0 auto 26px;color:var(--mut)}
.w{max-width:1200px;margin:0 auto;padding:0 5vw}
.n{max-width:980px}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:1px solid var(--ln);padding-bottom:14px;margin:20px 0 26px;flex-wrap:wrap}
.sh h2{margin:0;font-size:26px}.sh span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:22px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.ph{position:relative;display:block;aspect-ratio:1/1.05}
.tile{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff55;font-size:12px}
.card.sold .tile{filter:grayscale(1) blur(3px) brightness(.5)}
.tags{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2}
.tag{font-size:11px;padding:4px 9px;border-radius:6px;background:#000c;border:1px solid #ffffff1f}
.tag.sz{color:#6fb1ff;border-color:#1d3a63;background:#0b1830}
.stamp{position:absolute;z-index:2;inset:0;margin:auto;width:max-content;height:max-content;color:var(--red);border:2px solid var(--red);background:#ff453a22;padding:6px 16px;border-radius:6px;font:700 20px "Space Grotesk",sans-serif;letter-spacing:2px;transform:rotate(-6deg)}
.info{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-size:15px;line-height:1.3}
.cond{color:var(--mut);font-size:12px;margin:0}
.buy{margin-top:auto;padding-top:12px;border-top:1px solid var(--ln)}
.buy small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase}
.price{font:700 18px "Space Grotesk",sans-serif}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{flex:1;padding:11px 8px}
.crumbs{font-size:12px;color:var(--mut);margin:22px 0}.crumbs a:hover{color:var(--tx)}.crumbs b{color:var(--tx);font-weight:600}
.back{display:inline-block;margin:22px 0 16px;font-size:13px;color:var(--mut)}.back:hover{color:var(--tx)}
.pg{display:grid;grid-template-columns:64px minmax(0,1fr) 360px;gap:18px;align-items:start}
.fs{display:flex;flex-direction:column;gap:8px}
.fs button{position:relative;aspect-ratio:1;border:1px solid var(--ln);border-radius:10px;overflow:hidden;padding:0;cursor:pointer;background:none;opacity:.55}
.fs button.on{opacity:1;border-color:var(--ac)}
.big{position:relative;display:block;width:100%;aspect-ratio:4/5;border-radius:20px;overflow:hidden;border:1px solid var(--ln);cursor:zoom-in;padding:0;background:none;color:inherit}
.bt{position:absolute;z-index:2;font-size:11px;padding:5px 10px;border-radius:99px;background:#000c;border:1px solid #ffffff22;pointer-events:none}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:22px}
.panel h1{font-size:28px;line-height:1.1;margin:8px 0 10px}
.panel .price{font-size:30px;color:#6fb1ff;display:block}
.pw{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.was{color:var(--mut);font:500 13px "Space Grotesk",sans-serif;text-decoration:line-through;text-decoration-thickness:1.5px}
.panel .was{font-size:18px}
.pct{color:#fff;background:#d92d20;border-radius:6px;padding:2px 8px;font:700 12px "Space Grotesk",sans-serif;align-self:center}
.offb{position:absolute;top:12px;right:12px;z-index:2;color:#fff;background:#d92d20;border-radius:8px;padding:5px 10px;font:700 13px "Space Grotesk",sans-serif;box-shadow:0 4px 14px #0008}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--ln);font-size:14px;color:var(--mut);line-height:1.2}
.last+.opt{border-top:0;padding-top:4px}
.opt b{display:inline-flex;align-items:center;color:var(--tx);font-weight:600;font-size:15px;text-align:right}
.panel .opt .dot{width:12px;height:12px;margin-right:8px;top:0}
.bb{display:flex;gap:10px;margin-top:6px;padding-top:18px;border-top:1px solid var(--ln)}.bb .btn{flex:1;padding-left:10px;padding-right:10px}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:0 0 14px}.meter i{height:6px;border-radius:2px;background:#232938}.meter i.f{background:var(--ac)}
.last{margin:14px 0;padding:10px 12px;border-radius:10px;background:#0b1830;border:1px solid #1d3a63;font-size:13px;color:#8cc3ff}
.last.no{background:#ff453a1a;border-color:var(--red);color:#ffb3ad}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.row3 div{border:1px solid var(--ln);border-radius:10px;padding:10px 6px;font-size:12px;text-align:center}.row3 b{display:block;font-size:18px}.row3 small{color:var(--mut);display:block;line-height:1.3}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:14px 0}.specs div{border-left:2px solid var(--ac);padding-left:12px}.specs small{display:block;color:var(--mut);font-size:11px}
.more{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.more a{flex:none;width:150px}.more .mt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--ln)}.more small{display:block;font-size:12px;margin-top:6px}
.about{margin:40px 0 60px;padding-top:26px;border-top:1px solid var(--ln)}.about h2{margin:0;font-size:22px}
.lb{position:fixed;inset:0;z-index:60;background:#000e;display:none;align-items:center;justify-content:center;padding:20px}.lb.on{display:flex}
.lb .im{position:relative;width:min(520px,86vw);aspect-ratio:4/5;border-radius:16px;overflow:hidden}
.lb .nv{position:absolute;top:50%;transform:translateY(-50%);background:#000a;border:1px solid #ffffff33;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}
@media(max-width:900px){.pg{grid-template-columns:1fr}.fs{flex-direction:row;order:1}.fs button{width:60px}.panel{position:static;order:2}}
.ck{display:grid;grid-template-columns:1.5fr 1fr;gap:22px;align-items:start;padding-bottom:60px}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:20px;margin-bottom:16px}
.box h3{margin:0 0 12px;font-size:17px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin:10px 0 5px}
input,textarea{width:100%;background:#0a0c12;border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:11px 12px;font:inherit;font-size:14px}
input:focus,textarea:focus{border-color:var(--ac)}
.pay{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--ln);border-radius:10px;font-size:13px}
.pay small{display:block;color:var(--mut)}.pay .tg{margin-left:auto;font-size:10px;padding:3px 9px;border:1px solid #1d3a63;border-radius:99px;color:#6fb1ff;white-space:nowrap}
.li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);font-size:13px;align-items:center}
.li .mini{position:relative;width:46px;height:52px;border-radius:6px;overflow:hidden;flex:none}
.li small{display:block;color:var(--mut)}.li b{margin-left:auto;color:#6fb1ff;white-space:nowrap}
.tr{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;color:var(--mut)}
.tr.t{color:var(--tx);font:700 20px "Space Grotesk",sans-serif;border-top:1px solid var(--ln);margin-top:8px;padding-top:14px}.tr.t b{color:#6fb1ff}
.err{background:#ff453a1f;border:1px solid var(--red);color:#ffb3ad;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.fine{font-size:11px;color:var(--mut);text-align:center;margin:10px 0 0}
.done{text-align:center;padding:60px 0 90px;max-width:480px;margin:0 auto}.done p{color:var(--mut)}.done .ic{font-size:46px}
footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 5vw;border-top:1px solid var(--ln);color:var(--mut);font-size:13px;background:#000}
footer img{height:40px}.ml{color:inherit;text-decoration:underline;text-underline-offset:3px}.ml:hover{color:var(--ac)}footer button{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font:inherit}
.dv{position:fixed;inset:0;z-index:50;background:#000b;display:none;justify-content:flex-end}.dv.on{display:flex}
.dr{width:min(400px,100%);height:100%;overflow:auto;background:var(--card);border-left:1px solid var(--ln);padding:20px;animation:sl .2s ease-out}
@keyframes sl{from{transform:translateX(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.dr{animation:none}html{scroll-behavior:auto}}
.dh{display:flex;justify-content:space-between;align-items:center}.dh h3{margin:0;font-size:20px}
.x{background:none;border:0;color:var(--mut);font-size:28px;line-height:1;cursor:pointer}
.rm{background:none;border:0;color:var(--mut);font-size:11px;text-decoration:underline;cursor:pointer;padding:0}
.ib{background:none;border:1px solid #3a4255;color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer;font:600 13px Inter,sans-serif}
.ib b{background:var(--ac);border-radius:99px;padding:1px 7px;margin-left:4px;font-size:11px}
@media(max-width:800px){header{flex-wrap:wrap}nav{order:3;width:100%;overflow-x:auto;white-space:nowrap;gap:18px}.pg,.ck{grid-template-columns:1fr}.pill{display:none}}
.faq details{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:600}.faq p{color:var(--mut);margin:10px 0 0}
.lead{font-size:17px;color:var(--mut);max-width:640px}
nav a.hl{padding:5px 14px;border:1px solid var(--ac);border-radius:99px;color:#8cc3ff;background:#0b1830;box-shadow:0 0 0 3px #1a8cff22,0 0 20px #1a8cff66}
nav a.hl:hover{color:#fff;box-shadow:0 0 0 3px #1a8cff44,0 0 28px #1a8cffaa}
.feat{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);margin:0 0 56px;border:1px solid var(--ac);border-radius:20px;overflow:hidden;background:linear-gradient(120deg,#0b2447,#0a1226);box-shadow:0 0 0 4px #1a8cff1f,0 0 40px #1a8cff40}
.fph{position:relative;display:block;aspect-ratio:1/1;background:#0a1226}
.fin{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:30px 36px}
.ftag{font:700 11px "Space Grotesk",sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:#8cc3ff;background:#0b1830;border:1px solid #1d3a63;border-radius:99px;padding:5px 12px}
.fin h2{font-size:clamp(24px,3vw,36px);line-height:1.1;margin:14px 0 6px}.fin h2 a:hover{color:var(--ac)}
.fbr{color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.fsp{color:var(--mut);font-size:14px;margin:0 0 16px}
.fin .price{font-size:32px;color:#6fb1ff}.fin .was{font-size:18px}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
@media(max-width:760px){.feat{grid-template-columns:1fr;margin-bottom:44px}.fin{padding:22px 20px 24px}.fb{width:100%}.fb .btn{flex:1;padding-left:10px;padding-right:10px;white-space:nowrap}}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:-30px 0 70px;padding:22px 24px;border:1px solid var(--ac);border-radius:18px;background:linear-gradient(120deg,#0b2447,#0a1226);box-shadow:0 0 0 4px #1a8cff1f,0 0 40px #1a8cff55}
.cta b{display:block;font:700 20px "Space Grotesk",sans-serif}.cta span:not(.btn){color:var(--mut);font-size:14px}
.box.glow{border-color:var(--ac);box-shadow:0 0 0 4px #1a8cff1a,0 0 36px #1a8cff40}
.wp{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.wp img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
@media(max-width:800px){nav{padding:8px 6px}}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;pointer-events:none}
nav{align-items:center}nav a{display:inline-flex;align-items:center;line-height:1;padding:8px 0}nav a.hl{padding:9px 16px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#app>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards}
.card{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*45ms);transition:transform .25s,box-shadow .25s,border-color .25s}
.grid.na .card{animation:none}
.card:hover{transform:translateY(-4px);border-color:#1a8cff66;box-shadow:0 14px 40px #1a8cff22}
.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,filter .2s,box-shadow .2s,border-color .2s}
.btn:active{transform:scale(.97)}.btn:not([disabled]):hover{box-shadow:0 0 22px #1a8cff55}
.tools{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}#q{max-width:420px}
.fg{display:flex;align-items:center;gap:10px}.fl{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);min-width:64px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--ln);color:var(--tx);border-radius:99px;padding:7px 14px;font:600 12px Inter,sans-serif;cursor:pointer;transition:background .2s,border-color .2s}
.chip:hover{border-color:var(--ac)}.chip.on{background:var(--ac);border-color:var(--ac)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #ffffff55}.opt .dot,.specs .dot,.li .dot{vertical-align:middle;position:relative;top:-1px}
.none{grid-column:1/-1;text-align:center;color:var(--mut);padding:40px 0}
.drop{text-align:center;padding:50px 20px;margin-bottom:50px}.drop .ic{font-size:44px}
.drop form{display:flex;gap:8px;max-width:460px;margin:0 auto;flex-wrap:wrap}.drop input{flex:1;min-width:200px}
.ok{color:var(--ok);margin:0 auto}
@media(max-width:800px){input,textarea{font-size:16px}.fg{flex-direction:column;align-items:flex-start;gap:6px;width:100%}.ch{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:4px}.chip{white-space:nowrap;flex:none}header img{height:44px}}
@media(max-width:800px){nav{flex-wrap:wrap;overflow:visible;white-space:normal;justify-content:center;gap:4px 16px;padding:6px 0}nav a{padding:6px 0}nav a.hl{padding:7px 14px}}
.pg>*{min-width:0}@media(max-width:900px){.fs{overflow-x:auto;padding-bottom:4px}.fs button{flex:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
  <a href="#" aria-label="Drip Select početna"><img id="hl" alt="Drip Select"></a>
  <nav><a href="#proizvodi">Proizvodi</a><a href="#o-nama">O nama</a><a href="#pitanja">Česta pitanja</a><a href="#kontakt">Kontakt</a><a class="hl" href="#po-zelji">Naruči po želji</a></nav>
  <div class="hr"><span class="pill" id="pill"></span><button class="ib" data-cart type="button">Korpa <b id="cc">0</b></button></div>
</header>
<main id="app"></main>
<footer id="dostava">
  <img id="fl" alt="Drip Select">
  <span>Plaćanje pouzećem • 100% originali</span>
  <span><a id="fm" class="ml"></a><button id="reset" type="button">Resetuj demo</button></span>
</footer>
<div class="lb" id="lb" role="dialog" aria-label="Galerija"></div>

function pw(p,card){var w=was(p);return '<div class="pw"><span class="price">'+fmt(p.price)+'</span>'+(w?'<s class="was" title="Stara cena">'+fmt(w)+'</s>'+(card?'':'<span class="pct">-'+pct(p)+'%</span>'):'')+'</div>'}
function offb(p){return was(p)?'<div class="offb">-'+pct(p)+'%</div>':''}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sync(){try{var v=JSON.parse(ST.getItem("ds3"));if(v&&v.sold&&v.cart){S=v;if(S.p&&!LIVE)P=S.p}}catch(e){}S.cart=S.cart.filter(function(i){return !sold(i)})}
