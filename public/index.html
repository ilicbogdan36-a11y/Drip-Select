<style>

.hero{text-align:center;padding:40px 5vw 56px}

.zh svg{width:17px;height:17px}
@media(hover:none){.gn{opacity:.92;width:40px;height:40px}.gn svg{width:18px;height:18px}.gn.pv{left:8px}.gn.nx{right:8px}}
@media(prefers-reduced-motion:reduce){.trk{transition:none}}
.dts,.zh{transition:opacity .2s}
.lens{position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;pointer-events:none;z-index:4;opacity:0;transform:translate3d(-80px,-80px,0);transition:opacity .25s;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(26,140,255,.6),0 0 26px rgba(26,140,255,.5),inset 0 0 16px rgba(26,140,255,.22);background:radial-gradient(circle,rgba(26,140,255,.2),rgba(26,140,255,0) 70%)}
.lens:after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #1a8cff}
.mm{position:absolute;left:12px;bottom:12px;z-index:4;width:56px;aspect-ratio:4/5;border-radius:10px;border:1px solid #ffffff59;overflow:hidden;background-size:cover;background-color:var(--card);opacity:0;transform:translateY(6px) scale(.96);transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}

.gal.hz .big{cursor:none}
.gal.hz .lens,.gal.hz .mm{opacity:1}.gal.hz .mm{transform:none}
.gal.hz .dts,.gal.hz .zh{opacity:0}

.more{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}.more a{flex:none;width:210px;scroll-snap-align:start}.more .mt{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;border:1px solid var(--ln);transition:border-color .2s}.more .mt img{transition:transform .5s ease}.more a:hover .mt{border-color:rgba(76,141,255,.55)}.more a:hover .mt img{transform:scale(1.05)}.more small{display:block;font-size:15px;margin-top:10px;line-height:1.35}.more .mn{display:block;font-size:14px;opacity:.85;margin-bottom:2px}.more small b{font-size:16px}@media(max-width:560px){.more a{width:176px}}
.about{margin:40px 0 60px;padding-top:26px;border-top:1px solid var(--ln)}.about h2{margin:0;font-size:22px}
html.lbo{overflow:hidden}

function pathSlug(){var m=location.pathname.match(/^\/proizvod\/([^\/]+)\/?$/);return m?m[1]:null}
/* pojavljivanje pri skrolu: samo elementi koji su pri prikazu strane ISPOD ekrana dobijaju .rv (providni) i pojave se kad uđu u vidno polje.
   Ono što je odmah vidljivo ne dira se; bez IntersectionObserver-a, uz "smanji kretanje" ili sa REVEAL:0 ništa se ne sakriva. */
var RVSEL=".sh,.cta,.card,.box,.row3>div",rvIO=null,rvQ=0;
function rvCb(es){var n=0;es.forEach(function(e){if(!e.isIntersecting)return;var el=e.target;rvIO.unobserve(el);el.style.setProperty("--rd",Math.min(n++,5)*70+"ms");el.classList.add("in")})}
function rvScan(){rvQ=0;if(!rvIO)return;var els=app.querySelectorAll(RVSEL),i,el,r;
  for(i=0;i<els.length;i++){el=els[i];if(el._rv)continue;el._rv=1;if(el.parentNode&&el.parentNode.closest&&el.parentNode.closest(".rv"))continue;
    r=el.getBoundingClientRect();if(r.height>0&&r.top>innerHeight*.98){el.classList.add("rv");rvIO.observe(el)}}}
function rvInit(){if(RM||!CFG.REVEAL||!window.IntersectionObserver||!window.MutationObserver)return;
  try{rvIO=new IntersectionObserver(rvCb,{rootMargin:"0px 0px -6% 0px",threshold:.06});
    new MutationObserver(function(){if(!rvQ)rvQ=requestAnimationFrame(rvScan)}).observe(app,{childList:true,subtree:true});rvQ=requestAnimationFrame(rvScan)}catch(e){rvIO=null}}

}

function ipath(h){if(h==="#")return "/";if(h.charAt(0)==="#"){var x=h.slice(1);return isPg(x)?"/"+x:null}
  if(h.indexOf("/proizvod/")===0)return h;var m=h.match(/^\/([a-z-]*)$/);return m&&(m[1]===""||isPg(m[1]))?h:null}
