backend:
  name: github
  repo: ilicbogdan36-a11y/Drip-Select
  branch: main
  # __ORIGIN__ sajt sam zameni adresom na kojoj je otvoren (vidi src/worker.js)
  base_url: __ORIGIN__
  auth_endpoint: api/auth

media_folder: "public/images/products"
public_folder: "/images/products"

# Imena fajlova bez č/š/ž (npr. "duks-sarena.md")
slug:
  encoding: "ascii"
  clean_accents: true

collections:
  - name: "proizvodi"
    label: "Proizvodi"
    folder: "content/proizvodi"
    create: true
    # datum ispred imena = najnoviji proizvod ide prvi na sajtu
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Naziv artikla", name: "title", widget: "string" }
      - { label: "Brend", name: "brand", widget: "select", options: ["Nike", "Jordan", "The North Face", "Napapijri", "Hugo", "Boss", "Hugo Boss", "Tommy Hilfiger", "Ralph Lauren", "New Balance", "Ostalo"] }
      # gornji/donji deo: obavezno; koristi se za filter na sajtu i prikazuje se na karticama, stranici proizvoda i u korpi
      # (bez podrazumevane vrednosti, da se mora svesno izabrati i da pantalone slučajno ne završe kao gornji deo)
      - label: "Gornji ili donji deo"
        name: "category"
        widget: "select"
        required: true
        hint: "Obavezno. Gornji deo: duks, majica, jakna, dres, košulja. Donji deo: pantalone, šorc, donji deo trenerke."
        options: ["Gornji deo", "Donji deo"]
      - { label: "Cena (RSD)", name: "price", widget: "number" }
      # opciono: kad je upisana, sajt prikaže precrtanu staru cenu i procenat sniženja
      - label: "Stara cena (RSD) - samo ako je zaista bilo sniženje"
        name: "old_price"
        widget: "number"
        required: false
        min: 0
        hint: "Ostavi prazno ako nema sniženja. Upiši samo cenu po kojoj je artikal stvarno bio na prodaji. Mora biti veća od cene iznad, a procenat sniženja se računa sam."
      - { label: "Veličina", name: "size", widget: "select", options: ["S", "M", "L", "XL", "XXL"] }
      - { label: "Boja", name: "color", widget: "string" }
      - { label: "Stanje (1-10)", name: "condition", widget: "number", value_type: "float", min: 1, max: 10 }
      - { label: "Slika proizvoda (glavna)", name: "image", widget: "image" }
      - { label: "Slika 2 (opciono)", name: "image2", widget: "image", required: false }
      - { label: "Slika 3 (opciono)", name: "image3", widget: "image", required: false }
      - { label: "Slika 4 (opciono)", name: "image4", widget: "image", required: false }
      - { label: "Slika 5 (opciono)", name: "image5", widget: "image", required: false }
      - { label: "Slika 6 (opciono)", name: "image6", widget: "image", required: false }
      - { label: "Slika 7 (opciono)", name: "image7", widget: "image", required: false }
      # opciono: proizvod isečen bez pozadine (PNG/WebP sa providnom pozadinom); prikazuje se levo/desno na početnoj strani kad je uključena animacija
      # kadriranje: sajt seče slike u fiksan okvir od sredine; ovde pomeraš proizvod unutar okvira
      - label: "Položaj proizvoda na slici"
        name: "focus"
        widget: "select"
        default: "sredina"
        required: false
        hint: "Pomera proizvod unutar okvira: \"Pomeri dole\" spušta proizvod niže, \"Pomeri gore\" ga podiže. Sredina je podrazumevano."
        options:
          - { label: "Sredina", value: "sredina" }
          - { label: "Pomeri malo gore", value: "gore-malo" }
          - { label: "Pomeri gore", value: "gore" }
          - { label: "Pomeri malo dole", value: "dole-malo" }
          - { label: "Pomeri dole", value: "dole" }
          - { label: "Pomeri levo", value: "levo" }
          - { label: "Pomeri desno", value: "desno" }
      - label: "Istakni na vrhu početne strane"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
        hint: "Veliki istaknut artikal ispod naslova sa oznakom „Najbolje u kolekciji“. Označi najviše jedan. Kad se istaknuti proda (ili nijedan nije označen), taj deo se ne prikazuje dok ne istakneš novi."
      - { label: "Opis", name: "body", widget: "markdown" }
      # sajt ovo sam prebaci na true kad neko poruči; možeš i ručno da vratiš proizvod u prodaju
      - { label: "Prodato (SOLD OUT)", name: "sold", widget: "boolean", default: false, required: false }
